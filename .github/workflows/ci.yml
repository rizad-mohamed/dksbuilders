name: Validate and deliver DKS Builders
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate source and security policy
        run: npm run check
      - name: Build production assets
        run: npm run build
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Validate responsive layouts and accessibility
        run: npm run test:browser
      - name: Validate real video and fallback behavior
        run: npm run test:video
      - name: Validate engineering folio interactions
        run: npm run test:design
      - name: Audit dependency advisories
        run: npm audit --audit-level=low
      - name: Package tested release
        run: npm run package:release
      - name: Upload deployable archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dks-builders-${{ github.sha }}-${{ github.run_attempt }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Retain QA reports and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-${{ github.sha }}-${{ github.run_attempt }}
          path: qa-output/
          if-no-files-found: ignore
          retention-days: 14
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download tested archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dks-builders-${{ github.sha }}-${{ github.run_attempt }}
          path: release-output
      - name: Verify archive integrity
        working-directory: release-output
        run: sha256sum -c dks-builders.tar.gz.sha256
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          printf 'Tested DKS Builders static website.\n\nSource commit: %s\n\nSee docs/deployment.md for hosting and metadata requirements.\n' "$SOURCE_SHA" > release-notes.md
          gh release create "$RELEASE_TAG" --verify-tag --target "$SOURCE_SHA" --title "DKS Builders $RELEASE_TAG" --notes-file release-notes.md release-output/dks-builders.tar.gz release-output/dks-builders.tar.gz.sha256 release-output/SOURCE_COMMIT.txt
